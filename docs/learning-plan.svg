<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2200" viewBox="0 0 1600 2200" role="img" aria-labelledby="title desc">
  <title id="title">量化交易系统新手学习计划</title>
  <desc id="desc">一张从 Python、Pandas、量化基础、机器学习、PyTorch 到 Transformer Ranking 的六周学习路线图。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef6ff"/>
      <stop offset="50%" stop-color="#f7fbff"/>
      <stop offset="100%" stop-color="#fff7ed"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1e293b" flood-opacity="0.16"/>
    </filter>
    <style>
      .font { font-family: "Noto Sans CJK SC", "Microsoft YaHei", "PingFang SC", "WenQuanYi Micro Hei", Arial, sans-serif; }
      .title { font-size: 64px; font-weight: 800; fill: white; }
      .subtitle { font-size: 28px; fill: #dbeafe; }
      .small { font-size: 24px; fill: #475569; }
      .section-title { font-size: 32px; font-weight: 800; fill: #0f172a; }
      .card-title { font-size: 30px; font-weight: 800; fill: #0f172a; }
      .card-subtitle { font-size: 22px; font-weight: 700; fill: #2563eb; }
      .body { font-size: 22px; fill: #334155; }
      .body-strong { font-size: 23px; font-weight: 700; fill: #0f172a; }
      .chip { font-size: 20px; font-weight: 700; fill: white; }
      .week { font-size: 38px; font-weight: 900; fill: white; }
      .footer { font-size: 22px; fill: #64748b; }
    </style>
  </defs>

  <rect width="1600" height="2200" fill="url(#bg)"/>
  <circle cx="1420" cy="140" r="220" fill="#bfdbfe" opacity="0.35"/>
  <circle cx="120" cy="2060" r="260" fill="#fed7aa" opacity="0.35"/>

  <g filter="url(#shadow)">
    <rect x="90" y="80" width="1420" height="270" rx="38" fill="url(#hero)"/>
    <text x="140" y="175" class="font title">量化交易系统新手学习计划</text>
    <text x="140" y="235" class="font subtitle">目标：从看懂数据开始，逐步理解 train.py / model.py / 排序选股模型</text>
    <text x="140" y="292" class="font subtitle">学习主线：CSV → 特征 → 标签 → Dataset → Model → Loss → Top 5</text>
  </g>

  <g>
    <text x="100" y="435" class="font section-title">先记住这一句话</text>
    <rect x="100" y="465" width="1400" height="110" rx="28" fill="#ffffff" filter="url(#shadow)"/>
    <text x="145" y="530" class="font body-strong">系统做的事：用历史行情生成特征，让模型给 300 只股票打分，然后选择分数最高的 5 只。</text>
  </g>

  <g transform="translate(100 650)">
    <text x="0" y="0" class="font section-title">六周路线图</text>

    <g transform="translate(0 45)" filter="url(#shadow)">
      <rect x="0" y="0" width="445" height="350" rx="30" fill="#ffffff"/>
      <circle cx="62" cy="70" r="42" fill="#2563eb"/>
      <text x="38" y="84" class="font week">1</text>
      <text x="125" y="65" class="font card-title">Python 基础</text>
      <text x="125" y="102" class="font card-subtitle">能读懂 .py 文件</text>
      <text x="40" y="165" class="font body">• 变量、列表、字典、循环</text>
      <text x="40" y="210" class="font body">• 函数、类、import、路径</text>
      <text x="40" y="255" class="font body">• 练习：给股票收益排序</text>
      <rect x="40" y="292" width="250" height="38" rx="19" fill="#2563eb"/>
      <text x="62" y="318" class="font chip">产出：TopK 小脚本</text>
    </g>

    <g transform="translate(477 45)" filter="url(#shadow)">
      <rect x="0" y="0" width="445" height="350" rx="30" fill="#ffffff"/>
      <circle cx="62" cy="70" r="42" fill="#0891b2"/>
      <text x="38" y="84" class="font week">2</text>
      <text x="125" y="65" class="font card-title">Pandas 数据处理</text>
      <text x="125" y="102" class="font card-subtitle">看懂股票 CSV</text>
      <text x="40" y="165" class="font body">• read_csv、head、columns</text>
      <text x="40" y="210" class="font body">• groupby、shift、rolling</text>
      <text x="40" y="255" class="font body">• 练习：计算未来收益标签</text>
      <rect x="40" y="292" width="295" height="38" rx="19" fill="#0891b2"/>
      <text x="62" y="318" class="font chip">产出：特征表 DataFrame</text>
    </g>

    <g transform="translate(954 45)" filter="url(#shadow)">
      <rect x="0" y="0" width="445" height="350" rx="30" fill="#ffffff"/>
      <circle cx="62" cy="70" r="42" fill="#f97316"/>
      <text x="38" y="84" class="font week">3</text>
      <text x="125" y="65" class="font card-title">量化基础</text>
      <text x="125" y="102" class="font card-subtitle">理解收益和风险</text>
      <text x="40" y="165" class="font body">• 收益率、动量、波动率</text>
      <text x="40" y="210" class="font body">• 均线、成交量、未来函数</text>
      <text x="40" y="255" class="font body">• 练习：动量 + 波动率打分</text>
      <rect x="40" y="292" width="300" height="38" rx="19" fill="#f97316"/>
      <text x="62" y="318" class="font chip">产出：手工因子策略</text>
    </g>

    <g transform="translate(0 440)" filter="url(#shadow)">
      <rect x="0" y="0" width="445" height="350" rx="30" fill="#ffffff"/>
      <circle cx="62" cy="70" r="42" fill="#7c3aed"/>
      <text x="38" y="84" class="font week">4</text>
      <text x="125" y="65" class="font card-title">机器学习基础</text>
      <text x="125" y="102" class="font card-subtitle">理解训练为什么有效</text>
      <text x="40" y="165" class="font body">• 特征 X、标签 y</text>
      <text x="40" y="210" class="font body">• 训练集、验证集、loss</text>
      <text x="40" y="255" class="font body">• 练习：判断模型是否过拟合</text>
      <rect x="40" y="292" width="300" height="38" rx="19" fill="#7c3aed"/>
      <text x="62" y="318" class="font chip">产出：X / y 流程图</text>
    </g>

    <g transform="translate(477 440)" filter="url(#shadow)">
      <rect x="0" y="0" width="445" height="350" rx="30" fill="#ffffff"/>
      <circle cx="62" cy="70" r="42" fill="#16a34a"/>
      <text x="38" y="84" class="font week">5</text>
      <text x="125" y="65" class="font card-title">PyTorch 基础</text>
      <text x="125" y="102" class="font card-subtitle">看懂训练循环</text>
      <text x="40" y="165" class="font body">• Tensor、Dataset、DataLoader</text>
      <text x="40" y="210" class="font body">• nn.Module、forward、backward</text>
      <text x="40" y="255" class="font body">• 练习：线性模型输出股票分数</text>
      <rect x="40" y="292" width="305" height="38" rx="19" fill="#16a34a"/>
      <text x="62" y="318" class="font chip">产出：mini_train.py</text>
    </g>

    <g transform="translate(954 440)" filter="url(#shadow)">
      <rect x="0" y="0" width="445" height="350" rx="30" fill="#ffffff"/>
      <circle cx="62" cy="70" r="42" fill="#dc2626"/>
      <text x="38" y="84" class="font week">6</text>
      <text x="125" y="65" class="font card-title">Transformer + 排序</text>
      <text x="125" y="102" class="font card-subtitle">读懂 model.py 核心</text>
      <text x="40" y="165" class="font body">• 序列输入、位置编码、Attention</text>
      <text x="40" y="210" class="font body">• Ranking loss、Top 5 评估</text>
      <text x="40" y="255" class="font body">• 练习：画出 baseline 结构图</text>
      <rect x="40" y="292" width="330" height="38" rx="19" fill="#dc2626"/>
      <text x="62" y="318" class="font chip">产出：能解释 train/model</text>
    </g>
  </g>

  <g transform="translate(100 1530)">
    <text x="0" y="0" class="font section-title">阅读代码的正确顺序</text>
    <rect x="0" y="40" width="1400" height="245" rx="30" fill="#ffffff" filter="url(#shadow)"/>
    <g class="font">
      <rect x="48" y="82" width="188" height="58" rx="29" fill="#dbeafe"/>
      <text x="80" y="120" class="body-strong">1. main()</text>
      <path d="M250 111 H345" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
      <polygon points="345,111 325,99 325,123" fill="#94a3b8"/>

      <rect x="370" y="82" width="188" height="58" rx="29" fill="#cffafe"/>
      <text x="398" y="120" class="body-strong">2. 数据</text>
      <path d="M575 111 H670" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
      <polygon points="670,111 650,99 650,123" fill="#94a3b8"/>

      <rect x="695" y="82" width="188" height="58" rx="29" fill="#ffedd5"/>
      <text x="716" y="120" class="body-strong">3. Dataset</text>
      <path d="M900 111 H995" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
      <polygon points="995,111 975,99 975,123" fill="#94a3b8"/>

      <rect x="1020" y="82" width="188" height="58" rx="29" fill="#dcfce7"/>
      <text x="1050" y="120" class="body-strong">4. Model</text>
      <path d="M1225 111 H1320" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
      <polygon points="1320,111 1300,99 1300,123" fill="#94a3b8"/>

      <rect x="45" y="172" width="250" height="58" rx="29" fill="#f3e8ff"/>
      <text x="78" y="210" class="body-strong">5. Loss / 指标</text>
      <rect x="330" y="172" width="330" height="58" rx="29" fill="#fee2e2"/>
      <text x="360" y="210" class="body-strong">6. 保存 best_model</text>
      <text x="710" y="209" class="body">口诀：先看输入输出，再看中间细节；遇到张量先打印 shape。</text>
    </g>
  </g>

  <g transform="translate(100 1885)">
    <rect x="0" y="0" width="1400" height="170" rx="30" fill="#0f172a" filter="url(#shadow)"/>
    <text x="52" y="58" class="font" font-size="30" font-weight="800" fill="#ffffff">新手最小可行路径</text>
    <text x="52" y="108" class="font" font-size="24" fill="#cbd5e1">先实现：读取 CSV → 算未来收益 → 算过去 5 日动量 → 排序选 Top 5。</text>
    <text x="52" y="145" class="font" font-size="24" fill="#cbd5e1">再升级：加入波动率/成交量 → 线性模型 → PyTorch → Transformer 排序模型。</text>
  </g>

  <text x="100" y="2125" class="font footer">学习提醒：不要一开始调 Transformer 参数；先确保自己能解释数据、标签、特征、TopK 和未来函数。</text>
</svg>
